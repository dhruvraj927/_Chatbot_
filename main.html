<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATBOT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="Body">

    <div class="js-container"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script type="text/babel">

        function Chat_Input({Messages,SetMessages}){
            const [initial,setinput]=React.useState('');

            function write(event){
               setinput(event.target.value)
            }
            

            function add(){
                SetMessages([...Messages,{
                    text:initial,
                    sender:'user',
                    id:crypto.randomUUID()
                }])

                const response=Chatbot.getResponse(initial);
                SetMessages([...Messages,{
                    text:response,
                    sender:'bot',
                    id:crypto.randomUUID()
                }])
                setinput('');
            }
            return(
                <div className='Chat_input_container'>
                    <input 
                        type="text"
                        placeholder="Enter the message here" 
                        class='ChatInput'
                        value={initial}
                        onChange={write} >
                     
                    </input> 

                    <button 
                        class="Button_Click" 
                        onClick={add}
                    > Send </button>

                    

                </div>
            );
        }

        
        function MessageSee({Messages}){
            function ChatMess({ message, sender }) {
                return (
                    <div>
                        {sender === 'bot' && <img src='bot.jpg' width='30' />}
                        {message}
                        {sender === 'user' && <img src='me.jpg' width='30' />}
                    </div>
                );
            }
            const messagesmap=Messages.map((cm)=>{
                return (
                      <ChatMess
                        message={cm.text}
                        sender={cm.sender}
                    />
                )
            })
            return(
                <div className='Message_container'>
                    {messagesmap}
                </div>
            )
        }
        function App(){
            const [Messages,SetMessages]=React.useState({});
            return(
                <div className='App_container' >
                    <Chat_Input
                    Messages={Messages}
                    SetMessages={SetMessages}
                    />
                    <MessageSee
                    Messages={Messages}
                    />
                </div>
            );
        }


        const conatiner=document.querySelector(".js-container");
        ReactDOM.createRoot(conatiner).render(<App/>)

    </script>
</body>
</html>
